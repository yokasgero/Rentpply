name: Rentpply
options:
  bundleIdPrefix: com.rentpply
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Rentpply:
    type: application
    platform: iOS
    sources:
      - path: Rentpply
      - path: Site
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rentpply.app
        PRODUCT_NAME: Rentpply
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Rentpply/Info.plist
