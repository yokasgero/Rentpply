<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rentpply</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: mobile-first app shell. Sticky header with role switch, floating dock for tabs, content in a 1120px column, bottom-sheet for listing, booking and receipts. */
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --surface-2:#E9F0EE; --ink:#0F2220; --muted:#566A66; --line:#D8E3E0;
  --accent:#FF5A36; --accent-ink:#FFFFFF; --accent-soft:#FFE7E0;
  --ok:#0B8F7E; --ok-soft:#D7F1EC; --warn:#B26A00; --warn-soft:#FFEFCF; --bad:#CF2F2B; --bad-soft:#FDE1DF;
  --hero:#0E2B28; --hero-ink:#EAF6F3; --hero-muted:#9CC1BA; --hero-line:#25504A;
  --shadow:0 1px 2px rgba(15,34,32,.06),0 8px 24px rgba(15,34,32,.08);
  --cw:#2F7BD9; --cp:#D99A00; --ct:#8A5CD0; --cs:#0B8F7E;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1514; --surface:#112120; --surface-2:#182C2A; --ink:#E7F2EF; --muted:#8FA9A4; --line:#223836;
  --accent:#FF6B4A; --accent-ink:#1A0A06; --accent-soft:#3A1E17;
  --ok:#3CC9B2; --ok-soft:#10352F; --warn:#F2B04A; --warn-soft:#3A2B0E; --bad:#FF7A74; --bad-soft:#3E1917;
  --hero:#0C2220; --hero-ink:#EAF6F3; --hero-muted:#8DB5AE; --hero-line:#21443F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --cw:#6AA6F2; --cp:#F2C14A; --ct:#B290F0; --cs:#3CC9B2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1514; --surface:#112120; --surface-2:#182C2A; --ink:#E7F2EF; --muted:#8FA9A4; --line:#223836;
  --accent:#FF6B4A; --accent-ink:#1A0A06; --accent-soft:#3A1E17;
  --ok:#3CC9B2; --ok-soft:#10352F; --warn:#F2B04A; --warn-soft:#3A2B0E; --bad:#FF7A74; --bad-soft:#3E1917;
  --hero:#0C2220; --hero-ink:#EAF6F3; --hero-muted:#8DB5AE; --hero-line:#21443F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --cw:#6AA6F2; --cp:#F2C14A; --ct:#B290F0; --cs:#3CC9B2;
  color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:1120px;margin-inline:auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);padding-block:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.03em;margin-right:auto}
.logo b{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:55;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.dock nav{pointer-events:auto;max-width:560px;margin-inline:auto;background:var(--hero);border-radius:22px;padding:6px;display:flex;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.dock button{flex:1;min-width:0;border:0;background:none;color:var(--hero-muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:16px;font-size:11px;font-weight:600}
.dock button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sm{padding:7px 13px;min-height:34px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mute{background:var(--surface-2);color:var(--muted)}
.pill svg.i{width:13px;height:13px;stroke-width:2.4}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.inp{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 13px;min-height:44px;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:16px;padding-block:18px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:26px}
.scroll-x{overflow-x:auto}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:clamp(20px,4vw,40px);display:grid;gap:22px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,6.4vw,64px);font-weight:800;max-width:14ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .sub{color:var(--hero-muted);max-width:52ch}
.hero .skyline{position:absolute;right:-20px;bottom:0;width:min(46%,420px);opacity:.9;pointer-events:none}
@media (max-width:700px){.hero .skyline{opacity:.25;width:80%}}
.search{display:grid;gap:10px;grid-template-columns:1.4fr 1fr auto;background:var(--surface);color:var(--ink);padding:8px;border-radius:22px;max-width:760px;position:relative;z-index:1}
.search .inp{border:0;background:var(--surface-2)}
@media (max-width:700px){.search{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (min-width:800px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:700;font-size:13px}
.tile span.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.tile:hover{border-color:var(--accent)}

/* listing cards */
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;text-align:left;padding:0}
.lcard .art{aspect-ratio:16/10;position:relative;background:var(--surface-2)}
.lcard .art>svg{display:block;width:100%;height:100%}
.lcard .badges{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.lcard .heart{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#0F2220;display:grid;place-items:center}
.lcard .heart[aria-pressed="true"]{background:var(--accent);color:#fff}
.lcard .heart[aria-pressed="true"] svg{fill:currentColor}
.lcard .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.lcard h3{font-size:18px}
.price{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.price small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.am{display:flex;gap:6px;flex-wrap:wrap}
.am span{font-size:12px;background:var(--surface-2);border-radius:6px;padding:2px 8px;color:var(--muted);font-weight:600}
.stars{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.stars svg.i{width:15px;height:15px;fill:var(--accent);stroke:var(--accent)}

/* sheet */
.veil{position:fixed;inset:0;z-index:80;background:rgba(6,16,15,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94%;overflow:auto;border-radius:26px 26px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:800px){.veil{align-items:center;padding:24px}.sheet{border-radius:26px;max-height:92%}}
.sheet .bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--bg)}
.sheet .in{padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.meter{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-size:13px}
.meter i{display:block;height:7px;border-radius:5px;background:var(--surface-2);position:relative;overflow:hidden}
.meter i b{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:5px}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px;background:var(--surface);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .dot{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.receipt{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:16px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:600}
.tot{border-top:1.5px solid var(--ink);padding-top:10px;font-size:17px}

/* tables & units */
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.unit{border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:76px}
.unit b{font-family:var(--f-mono);font-size:13px}
.unit small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit.occupied{border-color:var(--ok);background:var(--ok-soft)}
.unit.vacant{border-style:dashed}
.unit.reserved{border-color:var(--warn);background:var(--warn-soft)}
.unit.maint{border-color:var(--bad);background:var(--bad-soft)}
.unit[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:28px;letter-spacing:-.03em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;border:1.5px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:92%;text-align:center}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:var(--r-sm);padding:10px 14px;font-size:13px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#0F2220;flex:none}
.match{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--ok)}
@media (prefers-reduced-motion:no-preference){.card,.lcard,.tile{transition:border-color .15s,transform .15s}.lcard:hover{transform:translateY(-2px)}.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.5}}}

/* agreements, receipts, tax */
.agrbox{max-height:230px;overflow:auto;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.agrbox h4{margin:0 0 2px;font-family:var(--f-display);font-size:14px;letter-spacing:-.01em}
.agrbox p{color:var(--muted)}
.chk{display:flex;gap:12px;align-items:flex-start;font-weight:600;line-height:1.4;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
.locked{opacity:.4;pointer-events:none;user-select:none}
.bar{height:12px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:7px}
.rrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.rrow .ric{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.rrow.first .ric{background:var(--accent-soft);color:var(--accent)}
.rrow .rr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tablebox{overflow:auto;max-height:460px}
.tablebox th{position:sticky;top:0;background:var(--surface);z-index:1}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
td.r,th.r{text-align:right}
.check{display:flex;gap:12px;align-items:flex-start}
.check .pill{flex:none;margin-top:2px}
.dock nav{overflow-x:auto;scrollbar-width:none}
@media (max-width:480px){.dock button{font-size:10px;padding:8px 0}.dock nav{padding:5px;gap:0}.dock button svg.i{width:18px;height:18px}}
/* payments hub, units */
.paytabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ptab{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;min-width:0}
.ptab b{font-family:var(--f-display);font-size:17px;letter-spacing:-.01em}
.ptab small{font-size:12px;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.ptab svg.i{color:var(--muted)}
.ptab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ptab[aria-pressed="true"] svg.i{color:var(--accent)}
.linkbtn{border:0;background:none;padding:0;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-align:left}
.unit{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.pcard{display:flex;flex-direction:column;gap:10px}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.share{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:var(--r-sm);padding:12px 14px;font-weight:600}
.share svg.i{color:var(--accent)}
#unitDetail{scroll-margin-top:84px}
@media (max-width:430px){.wm{display:none}.seg button{padding:6px 12px}}

/* ---- flow pages, gate, bell ---- */
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0;overflow:hidden}
.steps li{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);flex:1;min-width:0;white-space:nowrap}
.steps li span{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;flex:none}
.steps li span svg{width:12px;height:12px}
.steps li.cur{color:var(--ink)}.steps li.cur span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps li.done span{background:var(--ok);border-color:var(--ok);color:#fff}
@media (max-width:520px){.steps li:not(.cur){font-size:0;flex:none}.steps li:not(.cur) span{font-size:11px}}
.backbtn{display:inline-flex;gap:6px;align-items:center;font-weight:700;padding:6px 0;align-self:flex-start;color:var(--ink)}.backbtn svg{width:18px;height:18px}
.lp{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.lp{grid-template-columns:minmax(0,1fr) 360px;align-items:start}.lp-aside{position:sticky;top:84px}}
@media (max-width:899px){.lp-aside .applycard{display:none}.lp-aside:has(#sumBox){display:none}}
.heroart{border-radius:20px;overflow:hidden;max-height:340px}.heroart>svg{display:block;width:100%;height:auto}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.actbar .inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
@media (min-width:900px){.actbar:not(.always){display:none}}
body.flow .dock{display:none}body.flow main{padding-bottom:110px}
.amgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.amtile{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font-size:14px;font-weight:600}
.amtile svg{width:20px;height:20px;flex:none;color:var(--accent)}
.near{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.near svg{width:18px;height:18px}
.agrfull{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}

/* Landing image tilt and reveal transitions */
.lscene{perspective:1100px}.lphoto{transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out}.lphoto img{transform:translateZ(0)}.cf1{transform:translateZ(70px)}.cf2{transform:translateZ(50px)}.chipf:not(.cf1):not(.cf2){transform:translateZ(95px)}

.tilt{transition:transform .15s ease-out,box-shadow .2s;will-change:transform}.tilt:hover{box-shadow:0 22px 44px rgba(0,0,0,.2)}.rv.in.tilt{transition:transform .15s ease-out,box-shadow .2s}
}

/* Landing page refinements */
#landing{scroll-behavior:smooth}

.lhead-nav a:hover,.ltext-link:hover{color:#fff}
#landing .lnav>.btn{min-height:42px}

#landing .lphoto{max-width:620px;margin:0;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .32s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;will-change:transform}
#landing .lphoto img{aspect-ratio:1.25;object-position:center 58%;border-radius:24px;box-shadow:0 28px 70px rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.25)}
#landing .cf3{top:16px;left:16px;right:auto;border-radius:999px;background:rgba(13,39,36,.82);font-size:12px;padding:8px 12px;backdrop-filter:blur(10px)}
.lsearch-preview{position:relative;z-index:3;margin:-74px 18px 0;background:#fff;color:#17312d;border:1px solid rgba(15,34,32,.08);border-radius:20px;padding:18px;box-shadow:0 22px 54px rgba(0,0,0,.24)}
.lsearch-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.lsearch-heading>div{display:flex;flex-direction:column;gap:2px}.lsearch-heading .eyebrow{font-size:10px;color:#637871}.lsearch-heading b{font:700 20px/1.15 var(--f-display);letter-spacing:-.02em}
.lsearch-sample{background:#fff0e9;color:#a83f27;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}
.lsearch-form{display:grid;grid-template-columns:1.1fr 1fr 1fr auto;align-items:end;gap:8px}
.lsearch-field{min-width:0;display:flex;flex-direction:column;gap:5px}.lsearch-field>span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:#697b75}
.lsearch-field select{height:44px;min-width:0;width:100%;padding:0 10px;border:1px solid #dbe4e0;border-radius:10px;background:#f8faf9;color:#203d37;font-size:12px;font-weight:600}

.lsearch-rating{margin-left:auto;flex:none;color:#a76120;font-size:12px;font-weight:800}
.lproof{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:-24px}
.lproof>div{display:grid;grid-template-columns:42px 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 28px rgba(15,34,32,.08)}

/* Product tour: layered Kampala backdrop, product screens, and scroll-led transitions */
#landing .jny{height:520vh;height:520svh;min-height:3200px;margin-top:48px;position:relative}
#landing .jstick{position:sticky;top:0;isolation:isolate;height:100vh;height:100svh;min-height:620px;overflow:hidden;background:#0b211e;color:#eef8f4}
.jtown{position:absolute;inset:0;overflow:hidden;perspective:1100px;background:radial-gradient(ellipse at 72% 38%,rgba(74,137,117,.24),transparent 38%),linear-gradient(150deg,#102c28 0%,#0d2422 56%,#091a19 100%);z-index:-1}
.jglow{position:absolute;width:42vw;height:42vw;min-width:340px;min-height:340px;border-radius:50%;filter:blur(1px);opacity:.55;background:radial-gradient(circle,rgba(250,155,104,.24),rgba(255,180,125,.04) 46%,transparent 70%)}
.jglow-one{right:7%;top:8%}.jglow-two{left:-18%;bottom:2%;width:38vw;height:38vw;background:radial-gradient(circle,rgba(77,158,132,.22),transparent 68%)}
.jglow{transition:background .65s ease,opacity .65s ease,transform .8s ease}
.jtown{transition:background .8s ease}
.jstick[data-stage="1"] .jtown{background:radial-gradient(ellipse at 72% 38%,rgba(75,160,130,.3),transparent 40%),linear-gradient(150deg,#112f2b 0%,#102822 56%,#0a1a19 100%)}
.jstick[data-stage="2"] .jtown{background:radial-gradient(ellipse at 72% 38%,rgba(111,144,189,.28),transparent 40%),linear-gradient(150deg,#142b32 0%,#102329 56%,#09181b 100%)}
.jstick[data-stage="3"] .jtown{background:radial-gradient(ellipse at 72% 38%,rgba(218,140,104,.28),transparent 40%),linear-gradient(150deg,#2b2c2b 0%,#1b2825 56%,#0c1b19 100%)}

  let b = '';
  const n = 5 + Math.floor(r(1) * 3);
  for (let i = 0; i < n; i++) {
    const w = 38 + r(i + 2) * 30, x = 8 + i * (300 / n), ht = 50 + r(i + 9) * 90, y = 170 - ht;
    b += `<rect x="${x}" y="${y}" width="${w}" height="${ht}" rx="3" fill="hsl(${h + i * 8},${28 + r(i) * 20}%,${i % 2 ? 24 : 32}%)"/>`;
    for (let wy = y + 10; wy < 160; wy += 16) for (let wx = x + 8; wx < x + w - 8; wx += 13) b += `<rect x="${wx}" y="${wy}" width="6" height="8" rx="1.500" fill="hsl(${46},90%,${r(wx + wy) > .55 ? 72 : 30}%)" opacity="${r(wx * wy) > .55 ? 1 : .55}"/>`;
  }
  return `<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of ${esc(l.name)}"><defs><linearGradient id="g${l.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${h},55%,${big ? 62 : 58}%)"/><stop offset="1" stop-color="hsl(${h + 30},60%,82%)"/></linearGradient></defs><rect width="320" height="200" fill="url(#g${l.id})"/><circle cx="${250 + r(3) * 40}" cy="${34 + r(4) * 18}" r="16" fill="#FFF3C9" opacity=".9"/>${b}<rect y="168" width="320" height="32" fill="hsl(${h},25%,18%)"/><rect y="168" width="320" height="3" fill="hsl(${h},30%,28%)"/></svg>`;

function resolvePayment(id, ok) {
  const p = S.payments.find(x => x.id === id), l = byId(p.lid); if (!p || p.st !== 'pending') return;
  const a = S.agreements.find(x => x.id === p.agId);

  let room;
  if (p.lid === 1) { const sel = $('#pc-unit'); room = sel ? sel.value : 'A-' + (20 + hash(p.id) % 9); const u = UNITS.find(x => x.id === room);

function ownerLite(tab) {
  const lid = ownerLid(), l = byId(lid), list = admUnits(lid), st = e => admStatus(lid, e), n = k => list.filter(e => st(e) === k).length;
  const names = { occupied: 'Occupied', vacant: 'Vacant', reserved: 'Reserved', maint: 'Maintenance' };
  if (tab === 'overview' || tab === 'units') return `<section class="sec"><div class="sec-h"><div><span class="eyebrow">${esc(l.area)} · ${TYPE_NAME[l.type] || l.type}</span><h2>${esc(l.name)}</h2></div><span class="pill ok">Verified</span></div>
    <div class="tgrid"><div class="card tile2"><span class="muted">Rooms</span><b class="num">${list.length}</b></div><div class="card tile2"><span class="muted">Occupied</span><b class="num">${n('occupied')}</b></div><div class="card tile2"><span class="muted">Vacant</span><b class="num">${n('vacant')}</b></div><div class="card tile2"><span class="muted">Rent</span><b class="num">${fmt(l.price)}</b></div></div>
    <div class="card stack" style="gap:10px"><b>Your rooms</b><div class="units">${list.slice().sort((a, b) => (a.floor - b.floor) || a.id.localeCompare(b.id)).map(e => { const s = st(e); return `<button class="unit ${s}" data-lunit="${esc(e.id)}" aria-pressed="${S.lsel === e.id}"><b>${esc(e.id)}</b><small>${names[s]}</small></button>`; }).join('')}</div></div>
    ${(() => { const e = list.find(x => x.id === S.lsel); if (!e) return '<div class="card"><p class="muted">Tap a room card to see its status, floor and rent.</p></div>'; const s = st(e); return `<div class="card stack" id="unitDetail"><span class="eyebrow">Selected room</span><h3 style="margin:0">Room ${esc(e.id)}</h3><div class="row"><span class="pill ${s === 'occupied' ? 'ok' : 'info'}">${names[s]}</span><span class="muted">${floorName(e.floor)}</span></div><div class="muted">Rent ${fmt(e.rent || l.price)} / month</div></div>`; })()}
    <div class="card"><b>What happens next</b><p class="muted">When tenants book ${esc(l.name)}, their payments, agreements and maintenance requests appear in the Payments, Board and Requests tabs.</p></div></section>`;
  return `<section class="sec"><div class="sec-h"><div><span class="eyebrow">${esc(l.name)}</span><h2>${{ payments: 'Payments', terms: 'Board', requests: 'Requests' }[tab] || 'Nothing here'}</h2></div></div><div class="card"><b>Nothing here yet</b><p class="muted">This fills in as tenants book your rooms.</p><button class="btn ghost sm" data-oltab="overview" style="margin-top:8px">Back to overview</button></div></section>`;
}

document.addEventListener('click', e => { const el = e.target.closest('[data-lunit]'); if (!el) return; S.lsel = el.dataset.lunit; render(); const d = $('#unitDetail'); if (d) d.scrollIntoView({ block: 'start' }); });

/* ---------- landing page with floating buildings ---------- */
function bld(x, y, w, h, d, c, win, opt = {}) {
  const [f, s, t] = c, cols = opt.cols || Math.max(2, Math.round(w / 22)), rows = opt.rows || Math.max(2, Math.round(h / 26));
  let wins = '';
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
    const ww = (w - 14) / cols, wh = (h - 18) / rows, lit = (r * 7 + k * 3 + (opt.seed || 0)) % 5 === 0;
    wins += `<rect x="${x + 7 + k * ww + 2}" y="${y + 9 + r * wh + 2}" width="${ww - 5}" height="${wh - 6}" rx="2" fill="${lit ? '#FFC857' : win}" opacity="${lit ? 1 : .55}"/>`;
  }
  const sw = [];
  for (let r = 0; r < rows; r++) sw.push(`<path d="M${x + w + 5} ${y + 12 + r * (h - 18) / rows - d * .25} l${d - 10} ${-(d - 10) * .5} v${(h - 18) / rows - 8} l${-(d - 10)} ${(d - 10) * .5}z" fill="${win}" opacity=".35"/>`);
  return `<g>
    <polygon points="${x + w},${y} ${x + w + d},${y - d * .5} ${x + w + d},${y + h - d * .5} ${x + w},${y + h}" fill="${s}"/>
    <polygon points="${x},${y} ${x + d},${y - d * .5} ${x + w + d},${y - d * .5} ${x + w},${y}" fill="${t}"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>${wins}${sw.join('')}${opt.door ? `<rect x="${x + w / 2 - 9}" y="${y + h - 26}" width="18" height="26" rx="3" fill="${opt.door}"/>` : ''}${opt.roof || ''}</g>`;
}
function island(cx, cy, rw) {
  return `<g><path d="M${cx - rw} ${cy} Q${cx - rw * .5} ${cy + rw * .9} ${cx} ${cy + rw * 1.15} Q${cx + rw * .5} ${cy + rw * .9} ${cx + rw} ${cy}z" fill="#5C4A3D"/><path d="M${cx - rw * .55} ${cy + rw * .4} Q${cx - rw * .2} ${cy + rw * .75} ${cx} ${cy + rw * .95} Q${cx + rw * .1} ${cy + rw * .65} ${cx + rw * .35} ${cy + rw * .5}z" fill="#463728"/><ellipse cx="${cx}" cy="${cy}" rx="${rw}" ry="${rw * .26}" fill="#3FB68B"/><ellipse cx="${cx}" cy="${cy - 2}" rx="${rw * .9}" ry="${rw * .2}" fill="#56CBA0"/></g>`;
}
const tree = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-2" y="-8" width="4" height="10" fill="#6B4F3A"/><circle cx="0" cy="-16" r="9" fill="#2E9E78"/><circle cx="-5" cy="-11" r="6" fill="#36AE86"/></g>`;
function sceneSVG() {
  const cream = ['#F7F1E6', '#D8CFBE', '#FFFFFF'], teal = ['#1F9E8A', '#137567', '#35C2AC'], org = ['#FF6A45', '#D94422', '#FF9272'], navy = ['#1B4742', '#0F2D2A', '#2A6A62'];
  return `<svg class="scene" viewBox="0 0 560 470" role="img" aria-label="Illustration of floating buildings: a hostel, an apartment tower and a family house"><defs><radialGradient id="glow" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#FF5A36" stop-opacity=".28"/><stop offset="1" stop-color="#FF5A36" stop-opacity="0"/></radialGradient></defs>
    <circle cx="290" cy="215" r="230" fill="url(#glow)"/>
    <g class="cloud c1"><ellipse cx="90" cy="86" rx="46" ry="14" fill="#fff" opacity=".13"/><ellipse cx="120" cy="76" rx="30" ry="12" fill="#fff" opacity=".13"/></g>

let journeyFrame = 0, journeyUpdate = () => {};

function startEngine() {
  const root = $('#landing');
  if (!root || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  journeyUpdate = () => {
    journeyFrame = 0;
    const jny = $('#jny'), stick = $('#jstick');
    if (root.hidden || !jny || !stick) return;
    const copies = $$('.jc', jny), frames = $$('[data-frame]', jny), bar = $('#jbar'), count = $('#jcount');
    const rect = jny.getBoundingClientRect(), travel = Math.max(1, jny.offsetHeight - innerHeight);
    const progress = Math.max(0, Math.min(1, -rect.top / travel));
    const stage = Math.min(3, Math.floor(progress * 4));
    const local = progress >= 1 ? 1 : progress * 4 - stage;
    stick.dataset.stage = String(stage);
    stick.style.setProperty('--journey-progress', progress.toFixed(4));
    stick.style.setProperty('--stage-progress', Math.max(0, Math.min(1, local)).toFixed(4));
    stick.style.setProperty('--scene-lift', `${(0.5 - progress) * 34}px`);
    stick.style.setProperty('--scene-turn', `${(progress - 0.5) * -8}deg`);
    stick.style.setProperty('--far-shift', `${(progress - 0.5) * -44}px`);
    stick.style.setProperty('--near-shift', `${(progress - 0.5) * 30}px`);
    stick.style.setProperty('--near-shift-reverse', `${(progress - 0.5) * -30}px`);
    stick.style.setProperty('--near-shift-center', `${(progress - 0.5) * 14}px`);
    stick.style.setProperty('--card-angle', `${[-2.5, 1.8, -1.6, 2.3][stage] + (local - 0.5) * 1.2}deg`);
    copies.forEach((n, i) => { n.classList.toggle('on', i === stage); n.setAttribute('aria-hidden', String(i !== stage)); n.inert = i !== stage; });
    frames.forEach((n, i) => { n.classList.toggle('on', i === stage); n.style.setProperty('--frame-progress', i === stage ? String(local) : '0'); });
    if (bar) bar.style.width = `${progress * 100}%`;
    if (count) count.textContent = `0${stage + 1}`;
  };
  if (!root.dataset.journeyBound) {
    root.dataset.journeyBound = 'true';
    root.addEventListener('scroll', scheduleJourney, { passive: true });
    window.addEventListener('resize', scheduleJourney, { passive: true });
  }
  scheduleJourney();
}

  if ((el = c('[data-efris]'))) { const u = UNITS.find(x => x.id === el.dataset.efris); u.efris = u.corp ? 1 : u.ytdM; toast('EFRIS receipt submitted for ' + u.tenant); render(); return; }
  if (c('[data-efris-all]')) { occ.forEach(u => { u.efris = u.corp ? 1 : u.ytdM; }); toast('Pending receipts submitted to URA EFRIS (demo)'); render(); return; }
  if ((el = c('[data-paybill]'))) { const b = S.bills.find(x => x.id === el.dataset.paybill); b.st = 'paid'; b.paid = Date.now(); save(); toast(b.cat === 'staff' ? 'Salary sent to ' + b.name + ' by mobile money' : b.name + ' paid'); render(); return; }
  if (c('[data-payall]')) { S.bills.forEach(b => { if (b.st !== 'paid') { b.st = 'paid'; b.paid = Date.now(); } }); save(); toast('All bills and salaries paid'); render(); return; }
  if ((el = c('[data-rcpt]'))) { toast('Receipt emailed to the tenant'); return; }
  if ((el = c('[data-req]'))) { const [id, st] = el.dataset.req.split(':'); S.owner.req.find(r => r.id === id).st = st; if (id === 'q3' && st === 'approved') { const a2 = UNITS.find(x => x.id === 'A-02'); if (a2 && a2.st === 'occupied') { a2.roommate = 'Moses Tumusiime'; persistUnits(); } } toast(st === 'approved' ? 'Approved. Everyone has been notified.' : 'Declined'); render(); return; }
  /* admin */
  if ((el = c('[data-adm]'))) { const [id, st] = el.dataset.adm.split(':'), r = S.admin.q.find(x => x.id === id); r.st = st; if (r.lid && st === 'approved') { const l = byId(r.lid); l.v = 1; l.owner = 'Wasswa Rentals'; } toast(st === 'approved' ? 'Verified. The listing can now be booked.' : 'Rejected. The applicant is told what to fix.'); render(); return; }
  if ((el = c('[data-fr]'))) { const [id, st] = el.dataset.fr.split(':'); S.admin.fr.find(x => x.id === id).st = st; toast(st === 'suspended' ? 'Account and listing suspended' : 'Report dismissed'); render(); return; }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'landingSearch') {
    e.preventDefault();
    S.f = { type: $('#landType').value, q: $('#landArea').value, area: '', max: +$('#landBudget').value, sort: 'rec' };
    hideLanding(); S.role = 'tenant'; S.tab = 'explore'; render(true); return;
  }
  if (e.target.id === 'homeSearch') { e.preventDefault(); S.f = { type: $('#ht').value, q: $('#hq').value, area: '', max: 0 }; S.tab = 'explore'; render(true); }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'fq') { S.f.q = e.target.value; const l = exploreList(); $('#exList').innerHTML = exploreBody(l); $('#exCount').textContent = l.length + (l.length === 1 ? ' place' : ' places'); areaSuggest(e.target.value); }
  else if (id === 'bs') { BK.start = e.target.value || BK.start; if (!(S.page && S.page.name === 'payment')) agrRefresh(); }
  else if (id === 'bq') { BK.qty = +e.target.value; if (!(S.page && S.page.name === 'payment')) agrRefresh(); }
  else if (id === 'tm-rules') { tmPreview(); }
});
document.addEventListener('change', e => {
  const id = e.target.id, v = e.target.value;
  if (id === 'ky-stu') { $('#ky-stuf').hidden = !e.target.checked; return; }
  if (id === 'bq') { BK.qty = +v; agrRefresh(); return; }
  if (id === 'bs') { BK.start = v || BK.start; if (S.page && S.page.name === 'payment') render(); return; }
  if (id === 'bl-cat') { billFormHints(); return; }
  if (id === 'acc') { BK.acc = e.target.checked; accSync(); return; }
  if (id === 'agacc') { $('#agBtn').disabled = !e.target.checked; return; }
  if (id === 'tm-dep' || id === 'tm-late' || id === 'tm-notice') { tmPreview(); return; }
  if (id === 'fs') { S.f.sort = v; render(); }
  else if (({ rc: 'course', rcol: 'college', rg: 'gender', rs: 'sleep', rst: 'study' })[id]) { S.prefs[({ rc: 'course', rcol: 'college', rg: 'gender', rs: 'sleep', rst: 'study' })[id]] = v; save(); render(); }
  else if (id === 'rb') { S.prefs.budget = +v; save(); render(); } else if (id === 'rcl') { S.prefs.clean = +v; save(); render(); }
});
/* long press on a unit opens the quick status menu */
const lp = { t: null, done: false };
document.addEventListener('pointerdown', e => { const el = e.target.closest('[data-unit]'); if (!el) return; lp.done = false; clearTimeout(lp.t); lp.t = setTimeout(() => { lp.done = true; openUnitMenu(el.dataset.unit); try { navigator.vibrate && navigator.vibrate(15); } catch (_) {} }, 520); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, () => clearTimeout(lp.t), true));
document.addEventListener('contextmenu', e => { const el = e.target.closest('[data-unit]'); if (el) { e.preventDefault(); lp.done = true; openUnitMenu(el.dataset.unit); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

render();
if (!store.get('landed1')) showLanding();

</script>

</body></html>
