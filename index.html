<style>
/* Layout: mobile-first app shell. Sticky header with role switch, floating dock for tabs, content in a 1120px column, bottom-sheet for listing, booking and receipts. */
:root{
  --bg:#f6f2f3; --surface:#FFFFFF; --surface-2:#f0e9ea; --ink:#220f11; --muted:#6a5659; --line:#e3d8da;
  --accent:#FF5A36; --accent-ink:#FFFFFF; --accent-soft:#FFE7E0;
  --ok:#1b8a5a; --ok-soft:#dcf3e6; --brand:#7d1d28; --brand-2:#a02535; --brand-soft:#f6e1e4; --warn:#B26A00; --warn-soft:#FFEFCF; --bad:#CF2F2B; --bad-soft:#FDE1DF;
  --hero:#2b0e11; --hero-ink:#f6eaec; --hero-muted:#c19ca1; --hero-line:#50252a;
  --shadow:0 1px 2px rgba(34,15,17,.06),0 8px 24px rgba(34,15,17,.08);
  --cw:#2F7BD9; --cp:#D99A00; --ct:#8A5CD0; --cs:#7d1d28;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px;
}
:root[data-theme="dark"]{
  --bg:#211a1c; --surface:#2c2427; --surface-2:#382f32; --ink:#f8f1f2; --muted:#cdbdc0; --line:#4d4144;
  --accent:#ff7b59; --accent-ink:#ffffff; --accent-soft:#4b2b23;
  --ok:#62d6a0; --ok-soft:#1f3d2f; --brand:#ff94a3; --brand-2:#f36d80; --brand-soft:#4d252c; --warn:#ffc864; --warn-soft:#47381c; --bad:#ff8f88; --bad-soft:#4d2724;
  --hero:#3b1e24; --hero-ink:#fff5f6; --hero-muted:#e6c1c6; --hero-line:#5e3239;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.25);
  --cw:#7db3f5; --cp:#f5ca5c; --ct:#bf9ff5; --cs:#f36d80;
  color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-block:0;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:1120px;margin-inline:auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);padding-block:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.03em;margin-right:auto}
.logo b{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:55;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.dock nav{pointer-events:auto;max-width:560px;margin-inline:auto;background:var(--hero);border-radius:22px;padding:6px;display:flex;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.dock button{flex:1;min-width:0;border:0;background:none;color:var(--hero-muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:16px;font-size:11px;font-weight:600}
.dock button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sm{padding:7px 13px;min-height:34px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
 .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
 .pill.mute{background:var(--surface-2);color:var(--muted)}
.pill svg.i{width:13px;height:13px;stroke-width:2.4}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}

.inp{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 13px;min-height:44px;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:16px;padding-block:18px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:26px}
/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:clamp(20px,4vw,40px);display:grid;gap:22px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,6.4vw,64px);font-weight:800;max-width:14ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .sub{color:var(--hero-muted);max-width:52ch}
.hero .skyline{position:absolute;right:-20px;bottom:0;width:min(46%,420px);opacity:.9;pointer-events:none}
@media (max-width:700px){.hero .skyline{opacity:.25;width:80%}}
.search{display:grid;gap:10px;grid-template-columns:1.4fr 1fr auto;background:var(--surface);color:var(--ink);padding:8px;border-radius:22px;max-width:760px;position:relative;z-index:1}
.search .inp{border:0;background:var(--surface-2)}
@media (max-width:700px){.search{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (min-width:800px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:700;font-size:13px}
.tile span.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.tile:hover{border-color:var(--accent)}
/* listing cards */
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;text-align:left;padding:0}
.lcard .art{aspect-ratio:16/10;position:relative;background:var(--surface-2)}
.lcard .art>svg{display:block;width:100%;height:100%}
.lcard .badges{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.lcard .heart{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#220f11;display:grid;place-items:center}
.lcard .heart[aria-pressed="true"]{background:var(--accent);color:#fff}
.lcard .heart[aria-pressed="true"] svg{fill:currentColor}
.lcard .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.lcard h3{font-size:18px}
.price{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.price small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.am{display:flex;gap:6px;flex-wrap:wrap}
.am span{font-size:12px;background:var(--surface-2);border-radius:6px;padding:2px 8px;color:var(--muted);font-weight:600}
.stars{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.stars svg.i{width:15px;height:15px;fill:var(--accent);stroke:var(--accent)}
/* sheet */
.veil{position:fixed;inset:0;z-index:80;background:rgba(16,6,7,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94%;overflow:auto;border-radius:26px 26px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:800px){.veil{align-items:center;padding:24px}
.sheet{border-radius:26px;max-height:92%}}
.sheet .bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--bg)}
.sheet .in{padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px;background:var(--surface);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .dot{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.receipt{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:16px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:600}
.tot{border-top:1.5px solid var(--ink);padding-top:10px;font-size:17px}
/* tables & units */
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.unit{border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:76px}
.unit b{font-family:var(--f-mono);font-size:13px}
.unit small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit.occupied{border-color:var(--ok);background:var(--ok-soft)}
.unit.vacant{border-style:dashed}
.unit.reserved{border-color:var(--warn);background:var(--warn-soft)}
.unit.maint{border-color:var(--bad);background:var(--bad-soft)}
.unit[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:28px;letter-spacing:-.03em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:92%;text-align:center}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:var(--r-sm);padding:10px 14px;font-size:13px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#220f11;flex:none}
.match{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--ok)}
@media (prefers-reduced-motion:no-preference){.card,.lcard,.tile{transition:border-color .15s,transform .15s}
.lcard:hover{transform:translateY(-2px)}
.sheet{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.5}}}
/* agreements, receipts, tax */
.agrbox{max-height:230px;overflow:auto;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.agrbox h4{margin:0 0 2px;font-family:var(--f-display);font-size:14px;letter-spacing:-.01em}
.agrbox p{color:var(--muted)}
.chk{display:flex;gap:12px;align-items:flex-start;font-weight:600;line-height:1.4;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
.bar{height:12px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:7px}
.rrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.rrow .ric{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.rrow.first .ric{background:var(--accent-soft);color:var(--accent)}
.rrow .rr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
td.r,th.r{text-align:right}
.check{display:flex;gap:12px;align-items:flex-start}
.check .pill{flex:none;margin-top:2px}
.dock nav{overflow-x:auto;scrollbar-width:none}
@media (max-width:480px){.dock button{font-size:10px;padding:8px 0}
.dock nav{padding:5px;gap:0}
.dock button svg.i{width:18px;height:18px}}
/* payments hub, units */
.paytabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ptab{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;min-width:0}
.ptab b{font-family:var(--f-display);font-size:17px;letter-spacing:-.01em}
.ptab small{font-size:12px;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.ptab svg.i{color:var(--muted)}
.ptab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ptab[aria-pressed="true"] svg.i{color:var(--accent)}
.linkbtn{border:0;background:none;padding:0;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-align:left}
.unit{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.share{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:var(--r-sm);padding:12px 14px;font-weight:600}
.share svg.i{color:var(--accent)}
#unitDetail{scroll-margin-top:84px}
@media (max-width:430px){.wm{display:none}}
/* ---- flow pages, gate, bell ---- */
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0;overflow:hidden}
.steps li{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);flex:1;min-width:0;white-space:nowrap}
.steps li span{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;flex:none}
.steps li span svg{width:12px;height:12px}
.steps li.cur{color:var(--ink)}
.steps li.cur span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps li.done span{background:var(--ok);border-color:var(--ok);color:#fff}
@media (max-width:520px){.steps li:not(.cur){font-size:0;flex:none}
.steps li:not(.cur) span{font-size:11px}}
.backbtn{display:inline-flex;gap:6px;align-items:center;font-weight:700;padding:6px 0;align-self:flex-start;color:var(--ink)}
.backbtn svg{width:18px;height:18px}
.lp{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.lp{grid-template-columns:minmax(0,1fr) 360px;align-items:start}
.lp-aside{position:sticky;top:84px}}
@media (max-width:899px){.lp-aside:has(#sumBox){display:none}}
.heroart{border-radius:20px;overflow:hidden;max-height:340px}
.heroart>svg{display:block;width:100%;height:auto}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.actbar .inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
@media (min-width:900px){.actbar:not(.always){display:none}}
body.flow .dock{display:none}
body.flow main{padding-bottom:110px}
.near{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.near svg{width:18px;height:18px}
.agrfull{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.mtgrid{display:flex;flex-wrap:wrap;gap:8px}
.mtchip{display:inline-flex;gap:6px;align-items:center}
.mtchip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bell{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff;transform-origin:50% 8px}
.bell svg{width:15px;height:15px}
.bell i{position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;border-radius:8px;background:var(--ink);color:var(--bg);font:700 10px/15px var(--f-body);text-align:center;font-style:normal}
.unit{position:relative}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(18deg)}20%{transform:rotate(-16deg)}30%{transform:rotate(12deg)}40%{transform:rotate(-8deg)}50%{transform:rotate(4deg)}}

.fp-orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5}.fp-orb.o1{width:420px;height:420px;left:-120px;top:18%;background:radial-gradient(circle,#ff8a6a,transparent 70%)}.fp-orb.o2{width:380px;height:380px;right:32%;bottom:-120px;background:radial-gradient(circle,#c2332f,transparent 70%);opacity:.28}

.fp-live-l{display:flex;align-items:center;gap:8px;font:800 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--fm)}.fp-live-l i{width:8px;height:8px;border-radius:50%;background:#1b8a5a;animation:fpPing 1.8s infinite}
.fp-live b{font-size:18px}.fp-live small{color:var(--fmut)}.fp-live-r{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:800}.fp-live-r em{font-style:normal;color:var(--fmut);font-weight:600;font-size:12px;margin-left:4px}

.fp-marq{overflow:hidden;border-block:1px solid var(--fline);background:#fff;padding:16px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}

.fp-jny{position:relative;height:420vh;margin-top:clamp(48px,7vw,96px)}

.fp-clouds{left:-20%;right:-20%;top:9%;height:30%;translate:calc(var(--p) * -340px) 0}.fp-clouds i{position:absolute;height:34px;border-radius:999px;background:rgba(255,255,255,.78);box-shadow:30px -14px 0 -6px rgba(255,255,255,.78)}
.fp-clouds i:nth-child(1){left:6%;top:30px;width:150px}.fp-clouds i:nth-child(2){left:30%;top:86px;width:110px}.fp-clouds i:nth-child(3){left:56%;top:12px;width:170px}.fp-clouds i:nth-child(4){left:80%;top:70px;width:130px}
.fp-hills{left:-12%;right:-12%;bottom:0}.fp-hills.h1{height:30%;background:#a02535;opacity:.6;translate:calc(var(--p) * -120px) 0;clip-path:polygon(0 70%,8% 52%,18% 60%,30% 28%,44% 55%,58% 22%,72% 50%,84% 30%,100% 58%,100% 100%,0 100%)}

.fp-jgrid{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(20px,4vw,60px);align-items:center;padding-top:84px}

.fp-jcards{position:relative;min-height:270px;margin-top:20px}

.fp-jn{font:800 13px var(--f-body);color:var(--fo);letter-spacing:.1em}.fp-jc small{display:block;margin-top:2px;color:var(--fmut);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:11.5px}
#landing .fp-jc h3{font-size:clamp(26px,2.6vw,34px);font-weight:700;margin-block:8px 8px}#landing .fp-jc p{color:var(--fmut);line-height:1.6;font-size:16px}
.fp-jstat{display:flex;align-items:baseline;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid #f1e7e8}.fp-jstat b{font:800 36px/1 var(--f-display);color:var(--fm);letter-spacing:-.04em}.fp-jstat span{color:var(--fmut);font-weight:600}
.fp-road svg{width:100%;height:auto;max-height:68vh;display:block;overflow:visible}
.fp-roadbase{fill:none;stroke:rgba(74,17,25,.3);stroke-width:28;stroke-linecap:round}.fp-roaddash{fill:none;stroke:rgba(255,255,255,.75);stroke-width:3;stroke-dasharray:3 16;stroke-linecap:round}.fp-roadfill{fill:none;stroke:var(--fo);stroke-width:8;stroke-linecap:round}
.fp-node circle{fill:#fff;stroke:rgba(125,29,40,.4);stroke-width:3;transition:fill .35s,stroke .35s}.fp-node text{font:800 14px var(--f-body);fill:var(--fm);transition:fill .35s}.fp-node.done circle{fill:var(--fm);stroke:#fff}.fp-node.done text{fill:#fff}.fp-node .fp-nlabel{font:700 16px var(--f-body);fill:#fff;paint-order:stroke;stroke:rgba(74,17,25,.55);stroke-width:4px;stroke-linejoin:round}
#fpCar .pulse{fill:rgba(255,90,54,.35);transform-box:fill-box;transform-origin:center;animation:fpPulse 1.8s ease-out infinite}@keyframes fpPulse{from{transform:scale(.7);opacity:1}to{transform:scale(1.8);opacity:0}}
.fp-jbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.35);z-index:3}.fp-jbar i{display:block;height:100%;background:var(--fo);transform-origin:0 50%;transform:scaleX(0)}
.fp-line.light{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4)}.fp-line.light:hover{background:rgba(255,255,255,.22);border-color:#fff}
@media (max-width:980px){.fp-bgphoto{right:0;left:0;top:auto;bottom:0;width:100%;height:52%;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 45%);mask-image:linear-gradient(180deg,transparent 0,#000 45%);-webkit-mask-composite:source-over;mask-composite:add}.fp-visual{min-height:300px}.fp-live{right:auto;left:8px;bottom:8px}
  .fp-jgrid{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;align-content:start;gap:6px;padding-top:70px}.fp-jleft{display:contents}.fp-jhead{order:1}.fp-road{order:2}.fp-jcards{order:3;min-height:250px;margin-top:6px}.fp-jhead p{display:none}.fp-road svg{max-height:32vh}.fp-jc{padding:20px 22px}.fp-jphoto{inset:0}}

.fp-chip.c1{left:-26px;top:10%}.fp-chip.c2{right:4%;top:36%;bottom:auto}
.fp-hills{left:-45%;right:-45%}.fp-clouds{left:-40%;right:-40%}

.aimg{width:100%;height:100%;object-fit:cover;display:block}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px;-webkit-overflow-scrolling:touch}.gal .gi{flex:0 0 min(100%,640px);scroll-snap-align:start;border-radius:20px;overflow:hidden;aspect-ratio:16/10;background:var(--surface-2)}.gal img,.gal video{width:100%;height:100%;object-fit:cover;display:block}
.mapbox{border-radius:16px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;margin-top:8px}.mapbox iframe{width:100%;height:100%;border:0;display:block}

/* ===== platform logic: gate, floor pager, empty slots, board, heatmap, media ===== */
.gateveil{position:fixed;inset:0;z-index:80;background:rgba(20,6,8,.55);display:grid;place-items:end center;animation:rpFade .25s ease both}
.gatebox{width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;background:var(--bg)}.gatebox .in{display:flex;flex-direction:column;gap:14px;padding:22px 20px 26px}
@media (min-width:720px){.gateveil{place-items:center}.gatebox{border-radius:26px}}
body:has(.gateveil) .dock{display:none}
.fpager{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}.fpager::-webkit-scrollbar{display:none}.fpage{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.fchips{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-bottom:2px}.fchip{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap}.fchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}.fhint{font-size:12.5px;white-space:nowrap;margin-left:auto}
.unit.empty{border:1.5px dashed var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;min-height:70px;cursor:default}.unit.empty small{font-size:11px;opacity:.7}
.needrow.quiet{background:var(--surface-2)!important;border-left-color:var(--line)!important}.needrow.quiet b{color:var(--muted)}.ric.mute{background:var(--surface);color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.mt{display:flex;flex-direction:column;gap:6px}.mt img,.mt video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--surface-2)}
.upl{cursor:pointer}
.heat{display:flex;flex-direction:column;gap:4px;overflow-x:auto}.hrow{display:grid;grid-template-columns:42px repeat(6,minmax(30px,1fr));gap:4px;align-items:center;font-size:11.5px;color:var(--muted)}.hrow.hh span{text-align:center}.hc{display:block;height:24px;border-radius:6px;background:var(--s1);opacity:var(--a)}
.ramp{display:inline-block;width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--s1) 10%,transparent),var(--s1))}
.conv{font-size:11.5px;color:var(--muted);margin:-2px 0 4px 2px}
@keyframes rpUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes rpFade{from{opacity:0}to{opacity:1}}
@keyframes rpPop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes rpSheet{from{opacity:0;transform:translateY(40px) scale(.98)}to{opacity:1;transform:none}}
@keyframes rpToast{from{opacity:0;transform:translate(-50%,16px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes rpShimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ===== logo: house-shaped R, two-tone wordmark ===== */
.logo b,.authlogo b{width:36px;height:36px;filter:drop-shadow(0 6px 12px rgba(125,29,40,.28))}
.authlogo b{width:54px;height:54px}
.logo{cursor:pointer;gap:8px}
.logo .wm{font-family:var(--f-display);font-weight:800;letter-spacing:-.045em;background:none!important;color:var(--brand)!important;-webkit-text-fill-color:currentColor!important}
.logo .wm em{font-style:normal;color:var(--accent)!important;-webkit-text-fill-color:var(--accent)!important}

#landing .fp-foot .logo .wm{color:#fff!important}

.logo b svg.lm{transition:transform .5s var(--ease-spring)}
.logo:hover b svg.lm{transform:rotate(-6deg) scale(1.06)}

/* ===== landing: places rail ===== */
.fp-places{overflow:hidden}
.fp-phead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px 32px;flex-wrap:wrap;margin-bottom:22px}

.fp-tabs{display:flex;gap:4px;max-width:100%;overflow-x:auto;scrollbar-width:none;padding:5px;background:#fff;border:1px solid var(--fline);border-radius:999px;box-shadow:0 8px 22px rgba(60,12,20,.06)}
.fp-tabs::-webkit-scrollbar{display:none}

.fp-tabs button:hover{color:var(--fm)}

.fp-tabs button[aria-pressed="true"]{background:linear-gradient(135deg,var(--fm),var(--fm2));color:#fff;box-shadow:0 6px 16px rgba(125,29,40,.3)}
.fp-rail{--gut:max(20px,calc((100% - 1240px) / 2));display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gut);padding:12px var(--gut) 24px;scrollbar-width:none;cursor:grab;outline:none;transition:opacity .25s}
.fp-rail::-webkit-scrollbar{display:none}

.fp-rail:focus-visible{outline:3px solid var(--fo);outline-offset:-3px}
.fp-pc{flex:0 0 clamp(262px,24vw,330px);scroll-snap-align:start;position:relative;display:flex}

.fp-ph::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(30,8,10,.35));pointer-events:none}
.fp-ptag{position:absolute;top:14px;left:14px;z-index:2;font-weight:800;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fm);background:rgba(255,255,255,.94);padding:6px 11px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.12)}

.fp-pbody{display:flex;flex-direction:column;gap:8px;padding:16px 18px 18px;flex:1}

/* property art: generated skyline so every listing has a distinct picture until real photos are uploaded */

const sized = (url, w) => /^https:\/\/(upload|thumb)\.wikimedia\.org\/.+\/\d+px-/.test(url || '') ? url.replace(/\/\d+px-/, `/${w}px-`) : url;
let art = function (l, big) {
  const photo = (l.media || []).find(m => m.type === 'photo');
  if (photo) return `<img class="aimg" src="${esc(big ? photo.url : sized(photo.url, 960))}" alt="${esc(l.name)}" loading="lazy" decoding="async">`;
  const h = [352, 14, 28, 40, 338, 22, 6][Math.abs(Math.round(l.hue || 0)) % 7], r = n => { const x = Math.sin(l.id * 99.7 + n * 12.9898) * 43758.5453; return x - Math.floor(x) };
  let b = '';
  const n = 5 + Math.floor(r(1) * 3);
  for (let i = 0; i < n; i++) {
    const w = 38 + r(i + 2) * 30, x = 8 + i * (300 / n), ht = 50 + r(i + 9) * 90, y = 170 - ht;
    b += `<rect x="${x}" y="${y}" width="${w}" height="${ht}" rx="3" fill="hsl(${h + i * 8},${28 + r(i) * 20}%,${i % 2 ? 24 : 32}%)"/>`;
    for (let wy = y + 10; wy < 160; wy += 16) for (let wx = x + 8; wx < x + w - 8; wx += 13) b += `<rect x="${wx}" y="${wy}" width="6" height="8" rx="1.500" fill="hsl(${46},90%,${r(wx + wy) > .55 ? 72 : 30}%)" opacity="${r(wx * wy) > .55 ? 1 : .55}"/>`;
  }
  return `<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of ${esc(l.name)}"><defs><linearGradient id="g${l.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${h},55%,${big ? 62 : 58}%)"/><stop offset="1" stop-color="hsl(${h + 30},60%,82%)"/></linearGradient></defs><rect width="320" height="200" fill="url(#g${l.id})"/><circle cx="${250 + r(3) * 40}" cy="${34 + r(4) * 18}" r="16" fill="#FFF3C9" opacity=".9"/>${b}<rect y="168" width="320" height="32" fill="hsl(${h},25%,18%)"/><rect y="168" width="320" height="3" fill="hsl(${h},30%,28%)"/></svg>`;
};

/* ---------- listing sheet: details → pay → receipt ---------- */
/* One place for every pop-up: it slides in, swaps its content in place, and slides out. */
function setLayer(html) {
  const host = $('#layer'); clearTimeout(setLayer.t);
  const open = host.querySelector('.veil:not(.out)');
  if (!html) {
    if (!open) { if (!host.querySelector('.veil.out')) host.innerHTML = ''; return; }
    open.classList.add('out'); setLayer.t = setTimeout(() => { host.innerHTML = ''; }, 270); return;
  }
  const cur = open && open.querySelector('.sheet');
  if (cur) {
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    const next = tmp.querySelector('.sheet');
    if (next) {
      cur.className = next.className; cur.setAttribute('aria-label', next.getAttribute('aria-label') || '');
      cur.innerHTML = next.innerHTML; cur.classList.add('swap'); cur.scrollTop = 0;
      setTimeout(() => cur.classList.remove('swap'), 360); return;
    }
  }
  host.innerHTML = html;
}
window.rpLayer = setLayer;
['load', 'error'].forEach(ev => document.addEventListener(ev, e => { const t = e.target; if (t && t.classList && t.classList.contains('aimg')) t.classList.add('ok'); }, true));
function sheet(inner, title) {

}

  const areas = AREAS.filter(a => a.toLowerCase().includes(q)).map(a => { const n = L.filter(l => l.area === a && (S.f.type === 'all' || l.type === S.f.type)).length; return [a, 'pin', n + (n === 1 ? ' place' : ' places')]; });

async function kycSubmit() {
  const v = id => $('#' + id).value.trim(), f = id => $('#' + id).files && $('#' + id).files.length, stu = $('#ky-stu').checked;
  if (!S.user || !S.profile) { showAuth('signin'); return; }
  if (v('ky-n').length < 6) { toast('Enter your ID number'); $('#ky-n').focus(); return; }
  if (v('ky-nm').length < 3) { toast('Enter your name as on the ID'); $('#ky-nm').focus(); return; }
  if (!f('ky-id')) { toast('Add a photo of your ID'); return; }
  if (!f('ky-self')) { toast('Add a selfie'); return; }
  if (stu && !f('ky-sp')) { toast('Add your admission letter or student card'); return; }
  if (v('ky-kn').length < 2 || v('ky-kp').replace(/\D/g, '').length < 9) { toast('Add a next of kin and their phone'); $('#ky-kn').focus(); return; }
  if (!$('#ky-ok').checked) { toast('Tick the box to agree'); return; }
  const uploaded = [];
  const upload = async (inputId, label) => {
    const file = $('#' + inputId).files[0];
    if (file.size > 10 * 1024 * 1024) throw new Error('Each document must be smaller than 10 MB.');
    if (!['image/jpeg', 'image/png', 'image/webp', 'application/pdf'].includes(file.type)) throw new Error('Use a JPG, PNG, WEBP or PDF document.');
    const path = `${S.user.id}/${crypto.randomUUID()}-${label}.${file.name.split('.').pop().toLowerCase()}`;
    const { error } = await supabase.storage.from('kyc-documents').upload(path, file, { contentType: file.type, upsert: false });
    if (error) throw error;
    uploaded.push(path);
    return path;
  };
  try {
    const idDocument = await upload('ky-id', 'id');
    const selfie = await upload('ky-self', 'selfie');
    const studentProof = stu ? await upload('ky-sp', 'student-proof') : null;
    const updates = {
      kyc_status: 'review', id_type: v('ky-t'), id_number_masked: '••••' + v('ky-n').slice(-3),
      id_document_url: idDocument, selfie_url: selfie, student_proof_url: studentProof,
      is_student: stu, next_of_kin_name: v('ky-kn'), next_of_kin_phone: v('ky-kp'), updated_at: new Date().toISOString()
    };
    const { data, error } = await supabase.from('profiles').update(updates).eq('id', S.user.id).select().single();
    if (error) throw error;
    S.profile = data;
    S.kyc = { st: 'review', type: updates.id_type, mask: updates.id_number_masked, name: v('ky-nm'), student: stu, kin: v('ky-kn') + ', ' + v('ky-kp'), ts: Date.now() };
    render(true); toast('Documents submitted for administrator review.');
  } catch (error) {
    if (uploaded.length) await supabase.storage.from('kyc-documents').remove(uploaded);
    toast(error.message || 'Could not submit documents.');
  }
}

async function loadPublicListings() {
  if (!supabase) return;
  const { data, error } = await supabase.from('listings').select('*').eq('verified', true).order('created_at', { ascending: false });
  if (error || !data) return;
  const used = new Set();
  const liveListings = data.map((item, index) => {
    let id = Math.abs(hash(item.id)) || index + 1;
    while (used.has(id)) id++;
    used.add(id);
    return { id, dbId: item.id, name: item.name, type: item.type, area: item.area, price: item.price, per: item.per, unit: item.unit_type, dist: Number(item.distance_km) || 0, avail: item.available_units, total: item.total_units, v: item.verified ? 1 : 0, rating: 0, n: 0, hue: item.hue || 168, owner: item.owner_name, am: item.amenities || [], desc: item.description || '' };
  });
  const ids = data.map(item => item.id);
  const [tpl, locs, media] = ids.length ? await Promise.all([
    supabase.from('agreement_templates').select('listing_id, deposit_months, late_fee_percent, notice_days, house_rules').in('listing_id', ids),
    supabase.from('listing_locations').select('listing_id, lat, lng, address').in('listing_id', ids),
    supabase.from('listing_media').select('listing_id, type, url, sort_order').in('listing_id', ids).order('sort_order')
  ]) : [{ data: [] }, { data: [] }, { data: [] }];
  liveListings.forEach(l => {
    const t = (tpl.data || []).find(x => x.listing_id === l.dbId);
    if (t) l.terms = { deposit: t.deposit_months ?? 0, late: t.late_fee_percent ?? 0, notice: t.notice_days ?? 30, ...(t.house_rules && t.house_rules.trim() ? { rules: t.house_rules.trim() } : {}) };
    const loc = (locs.data || []).find(x => x.listing_id === l.dbId);
    if (loc && loc.lat != null && loc.lng != null) l.loc = { lat: Number(loc.lat), lng: Number(loc.lng), address: loc.address || '' };
    l.media = (media.data || []).filter(x => x.listing_id === l.dbId && x.url);
  });
  L.splice(0, L.length, ...liveListings);
  AREAS.splice(0, AREAS.length, ...new Set(liveListings.map(item => item.area)));
  updateLandingLive();
}

    if (S.user && listing?.dbId) {
      const request = wasSaved
        ? supabase.from('saved_listings').delete().eq('user_id', S.user.id).eq('listing_id', listing.dbId)
        : supabase.from('saved_listings').upsert({ user_id: S.user.id, listing_id: listing.dbId });
      const { error } = await request;
      if (error) { S.saved = wasSaved ? [...S.saved, id] : S.saved.filter(savedId => savedId !== id); toast(error.message || 'Could not update saved listings.'); return; }
    }
    save(); el.setAttribute('aria-pressed', S.saved.includes(id)); toast(S.saved.includes(id) ? 'Saved to your list' : 'Removed from your list'); return;
  }
  if ((el = c('[data-open]'))) { openListing(+el.dataset.open); return; }
  if ((el = c('[data-area]'))) { S.f.q = el.dataset.area; S.f.area = ''; render(); return; }
  if ((el = c('[data-max]'))) { S.f.max = +el.dataset.max; render(); return; }
  if ((el = c('[data-clear]'))) { S.f.q = ''; S.f.area = ''; render(); return; }
  if (c('[data-clearall]')) { S.f = { type: 'all', q: '', area: '', max: 0, sort: 'rec' }; render(); return; }
  if ((el = c('[data-type]'))) { S.f.type = el.dataset.type; render(); return; }
  if (c('[data-close]') || (t.matches && t.matches('[data-veil]'))) { closeSheet(); return; }
  if ((el = c('[data-payer]'))) { BK.paidBy = el.dataset.payer; document.querySelectorAll('[data-payer]').forEach(b => b.setAttribute('aria-pressed', b === el)); $('#sp').hidden = BK.paidBy !== 'Sponsor'; return; }
  if ((el = c('[data-method]'))) { BK.method = el.dataset.method; document.querySelectorAll('[data-method]').forEach(b => b.setAttribute('aria-pressed', b === el)); const card = BK.method === 'Card'; $('#ph').placeholder = card ? 'Name on card' : '07XX XXX XXX'; $('#ph').inputMode = card ? 'text' : 'tel'; return; }
  if (c('[data-pay]')) { doPay(); return; }
  if ((el = c('[data-more]'))) { if (el.dataset.more === 'desc') { const d = $('#descp'); d.classList.toggle('clamp'); el.textContent = d.classList.contains('clamp') ? 'Show more' : 'Show less'; } else { const ul = el.previousElementSibling, h = ul.querySelectorAll('.more'), open = h[0] && h[0].hidden; h.forEach(x => { x.hidden = !open; }); el.textContent = open ? 'Show less' : 'Show more'; } return; }
  if ((el = c('[data-view]'))) { openViewing(+el.dataset.view); return; }
  if ((el = c('[data-vsend]'))) {
    if (!S.user) { closeSheet(); showAuth('signin'); return; }
    const listing = byId(+el.dataset.vsend), day = $('#vw-d').value, time = $('#vw-t').value;
    el.disabled = true; el.textContent = 'Sending…';
    const { error } = await supabase.rpc('request_viewing', { listing_uuid: listing.dbId, preferred_day: day, preferred_time: time });
    if (error) { el.disabled = false; el.textContent = 'Send request'; toast(error.message || 'Could not send your request.'); return; }
    closeSheet(); toast('Viewing requested for ' + fdate(day) + '. ' + listing.owner + ' has been notified.'); return;
  }
  if (c('[data-apply]')) { S.page = { name: 'agreement', lid: BK.lid }; render(true); return; }
  if (c('[data-continue]')) { goPayment(); return; }
  if (c('[data-back]')) { const n = S.page && S.page.name; if (n === 'payment') S.page = { name: 'agreement', lid: BK.lid }; else if (n === 'agreement') S.page = { name: 'listing', lid: BK.lid }; else { S.page = null; BK = null; } render(true); return; }
  if ((el = c('[data-flowexit]'))) { S.page = null; BK = null; if (el.dataset.flowexit) S.tab = el.dataset.flowexit; render(true); return; }
  if ((el = c('[data-statuspage]'))) { const p = S.payments.find(x => x.id === el.dataset.statuspage); S.page = { name: 'status', lid: p.lid, pid: p.id }; render(true); return; }
  if ((el = c('[data-report]'))) { openReport(el.dataset.report); return; }
  if ((el = c('[data-mtype]'))) { MT.type = el.dataset.mtype; document.querySelectorAll('[data-mtype]').forEach(b => b.setAttribute('aria-pressed', b === el)); return; }
  if ((el = c('[data-murg]'))) { MT.urgent = el.dataset.murg === '1'; document.querySelectorAll('[data-murg]').forEach(b => b.setAttribute('aria-pressed', b === el)); return; }
  if (c('[data-msend]')) { sendReport(); return; }
  if ((el = c('[data-receipt]'))) { showReceipt({ id: el.dataset.receipt }); return; }
  if ((el = c('[data-ask]'))) {
    if (!S.user) { showAuth('signin'); return; }
    const { error } = await supabase.rpc('send_roommate_request', { target_user: el.dataset.ask });
    if (error) { toast(error.message || 'Could not send roommate request.'); return; }
    await loadTenantData(); render(); toast('Roommate request sent.'); return;
  }
  if ((el = c('[data-roommate-decision]'))) {
    const [id, status] = el.dataset.roommateDecision.split(':');
    const { error } = await supabase.rpc('respond_roommate_request', { request_uuid: id, accept_request: status === 'accepted' });
    if (error) { toast(error.message || 'Could not update roommate request.'); return; }
    await loadTenantData(); render(); toast(status === 'accepted' ? 'Roommate request accepted.' : 'Roommate request declined.'); return;
  }
  if ((el = c('[data-take]'))) {
    const { error } = await supabase.rpc('request_rent_transfer', { transfer_uuid: el.dataset.take });
    if (error) { toast(error.message || 'Could not request this transfer.'); return; }
    await loadTenantData(); render(); toast('Request sent to the property owner.'); return;
  }
  if ((el = c('[data-list]'))) {
    const booking = S.bookings.find(item => item.id === el.dataset.list), listing = booking && byId(booking.lid);
    if (!booking?.dbId || !listing?.dbId) { toast('This stay is not linked to a confirmed live booking.'); return; }
    const price = +$('#sp-p-' + booking.id).value || listing.price;
    const availableFrom = $('#sp-f-' + booking.id).value || iso(NOW + 7 * DAY);
    const reason = $('#sp-r-' + booking.id).value;
    const { error } = await supabase.rpc('create_rent_transfer', { booking_uuid: booking.dbId, requested_price: price, available_from: availableFrom, transfer_reason: reason });
    if (error) { toast(error.message || 'Could not list this rent transfer.'); return; }
    await loadTenantData(); render(); toast('Transfer listing sent to the owner workflow.'); return;
  }
  if ((el = c('[data-copy]'))) { const v = el.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast('Link copied')).catch(() => { const r = document.createRange(); const code = el.parentNode.querySelector('code'); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Press and hold to copy'); }); return; }
  /* owner */
  /* agreements, bills, tax */
  if ((el = c('[data-agview]'))) { openAgreement(el.dataset.agview, S.role === 'owner' ? 'owner' : 'tenant'); return; }
  /* admin */
});
document.addEventListener('submit', async e => {
  const form = e.target.closest('[data-auth-form], [data-live-form]');
  if (form?.matches('[data-auth-form="forgot"]')) {
    e.preventDefault();
    const values = Object.fromEntries(new FormData(form));
    try {
      const { error } = await supabase.auth.resetPasswordForEmail(values.email, { redirectTo: `${window.location.origin}/` });
      if (error) throw error;
      S.authNotice = 'If that email belongs to a Rentpply account, a secure reset link is on its way.';
      render();
    } catch (error) { S.authNotice = error.message || 'Could not send a reset email.'; render(); }
    return;
  }
  if (form?.matches('[data-auth-form="reset"]')) {
    e.preventDefault();
    const values = Object.fromEntries(new FormData(form));
    try {
      const { error } = await supabase.auth.updateUser({ password: values.password });
      if (error) throw error;
      S.authPage = { mode: 'signin', audience: 'housing' };
      S.authNotice = 'Password updated. Sign in with your new password.';
      await auth.signOut();
      render(true);
    } catch (error) { S.authNotice = error.message || 'Could not update your password.'; render(); }
    return;
  }
  if (form?.matches('[data-auth-form="signin"]')) {
    e.preventDefault();
    const values = Object.fromEntries(new FormData(form));
    try { await auth.signIn(values.email, values.password); }
    catch (error) { S.authNotice = error.message || 'Sign in failed.'; render(); }
    return;
  }
  if (form?.matches('[data-auth-form="signup"]')) {
    e.preventDefault();
    const values = Object.fromEntries(new FormData(form));
    try {
      await auth.signUp(values.email, values.password, { full_name: values.full_name, role: values.role });
      S.authNotice = 'Account created. Check your email to confirm it, then sign in.';
      render();
    } catch (error) { S.authNotice = error.message || 'Account creation failed.'; render(); }
    return;
  }
  if (form?.matches('[data-live-form]')) {
    e.preventDefault();
    if (!S.profile || !['owner', 'admin'].includes(S.profile.role)) return;
    try {
      if (await handlePortalSubmit(form, S.profile.role, S.user, S.profile, S.liveData, refreshPortal)) toast('Changes saved.');
    } catch (error) { toast(error.message || 'Could not save that record.'); }
    return;
  }
  if (e.target.id === 'homeSearch') { e.preventDefault(); S.f = { type: $('#ht').value, q: $('#hq').value, area: '', max: 0 }; S.tab = 'explore'; render(true); }
});
document.addEventListener('input', e => {
  if (handlePortalInput(e.target)) return;
  const id = e.target.id;
  if (id === 'fq') { S.f.q = e.target.value; const l = exploreList(); $('#exList').innerHTML = exploreBody(l); $('#exCount').textContent = l.length + (l.length === 1 ? ' place' : ' places'); areaSuggest(e.target.value); }
  else if (id === 'bs') { BK.start = e.target.value || BK.start; if (!(S.page && S.page.name === 'payment')) agrRefresh(); }
  else if (id === 'bq') { BK.qty = +e.target.value; if (!(S.page && S.page.name === 'payment')) agrRefresh(); }
});
document.addEventListener('change', async e => {
  const id = e.target.id, v = e.target.value;
  if (e.target.matches('[data-admin-view]')) {
    if (S.profile?.role !== 'admin') return;
    S.role = e.target.value;
    S.viewRole = S.role;
    S.tab = FIRST[S.role];
    setLayer('');
    render(true);
    return;
  }
  if (S.profile && ['owner', 'admin'].includes(S.profile.role)) {
    try { if (await handlePortalChange(e.target, refreshPortal, { rerender: () => render(), data: S.liveData, toast })) { if (!e.target.matches('[data-p-ownerpick],[data-p-layfloor],[data-p-media-up]')) toast('Changes saved.'); return; } }
    catch (error) { toast(error.message || 'Could not update that record.'); return; }
  }
  if (id === 'ky-stu') { $('#ky-stuf').hidden = !e.target.checked; return; }
  if (id === 'bq') { BK.qty = +v; agrRefresh(); return; }
  if (id === 'bs') { BK.start = v || BK.start; if (S.page && S.page.name === 'payment') render(); return; }
  if (id === 'acc') { BK.acc = e.target.checked; accSync(); return; }
  if (id === 'fs') { S.f.sort = v; render(); }
  else if (({ rc: 'course', rcol: 'college', rg: 'gender', rs: 'sleep', rst: 'study' })[id]) { S.prefs[({ rc: 'course', rcol: 'college', rg: 'gender', rs: 'sleep', rst: 'study' })[id]] = v; save(); render(); }
  else if (id === 'rb') { S.prefs.budget = +v; save(); render(); } else if (id === 'rcl') { S.prefs.clean = +v; save(); render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

render();
if (!S.user && !S.authPage) showLanding();
initLiveAuth();

</script>

</body></html>
